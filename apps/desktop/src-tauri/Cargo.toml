[package]
name = "oryn-desktop"
version = "0.1.0"
description = "ORYN for macOS: a native window onto an ORYN server"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/seyhunak/oryn"
publish = false

# Kept out of the server workspace so `cargo build` / CI there never compile Tauri.
[workspace]

[lib]
name = "oryn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
