[workspace]
resolver = "2"
members = [
    "crates/oryn-domain",
    "crates/oryn-observability",
    "crates/oryn-auth",
    "crates/oryn-db",
    "crates/oryn-artifacts",
    "crates/oryn-bdd",
    "crates/oryn-api-engine",
    "crates/oryn-execution",
    "crates/oryn-model-gateway",
    "crates/oryn-intelligence",
    "crates/oryn-api",
    "crates/oryn-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/oryn-dev/oryn"
authors = ["ORYN contributors"]

[workspace.dependencies]
oryn-domain = { path = "crates/oryn-domain" }
oryn-observability = { path = "crates/oryn-observability" }
oryn-auth = { path = "crates/oryn-auth" }
oryn-db = { path = "crates/oryn-db" }
oryn-artifacts = { path = "crates/oryn-artifacts" }
oryn-bdd = { path = "crates/oryn-bdd" }
oryn-api-engine = { path = "crates/oryn-api-engine" }
oryn-execution = { path = "crates/oryn-execution" }
oryn-model-gateway = { path = "crates/oryn-model-gateway" }
oryn-intelligence = { path = "crates/oryn-intelligence" }

tokio = { version = "1.44", features = ["full"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6", features = ["trace", "cors", "request-id", "limit", "timeout", "propagate-header", "sensitive-headers", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
opentelemetry = "0.29"
opentelemetry_sdk = { version = "0.29", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.29", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
tracing-opentelemetry = "0.30"
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.2"
validator = { version = "0.20", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
argon2 = "0.5"
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
rand = "0.8"
hex = "0.4"
regex = "1"
gherkin = "0.14"
jsonschema = { version = "0.29", default-features = false }
serde_json_path = "0.7"
serde_yaml = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
redis = { version = "0.29", features = ["tokio-comp", "connection-manager"] }
url = "2"
ipnet = "2"
once_cell = "1"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4
