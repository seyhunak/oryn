[package]
name = "oryn-worker"
description = "ORYN execution worker: leases jobs from the control plane and runs them with the Rust execution engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "oryn-worker"
path = "src/main.rs"

[dependencies]
oryn-domain = { workspace = true }
oryn-execution = { workspace = true }
oryn-observability = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
oryn-api = { path = "../oryn-api" }
oryn-db = { workspace = true }
sqlx = { workspace = true }
axum = { workspace = true }
tempfile = { workspace = true }
