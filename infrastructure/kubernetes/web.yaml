apiVersion: apps/v1
kind: Deployment
metadata: { name: web }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: web
          # Built with --build-arg ORYN_API_INTERNAL_URL=http://api:8080 (the default).
          image: ghcr.io/seyhunak/oryn-web
          ports: [{ containerPort: 3000, name: http }]
          readinessProbe: { httpGet: { path: /login, port: http }, periodSeconds: 15 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: web }
spec:
  selector: { app: web }
  ports: [{ port: 3000, targetPort: http }]
