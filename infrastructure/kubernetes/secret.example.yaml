# REPLACE every value before applying (or manage this Secret with your secret store).
#   ORYN_SECRET_KEY: openssl rand -base64 48   (encrypts stored credentials; never rotate casually)
apiVersion: v1
kind: Secret
metadata:
  name: oryn-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgres://oryn:change-me@postgres:5432/oryn
  ORYN_SECRET_KEY: change-me-to-at-least-32-random-characters
  ORYN_WORKER_BOOTSTRAP_TOKEN: change-me-worker-bootstrap
  ORYN_RUNNER_TOKEN: change-me-runner-token
