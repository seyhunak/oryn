apiVersion: v1
kind: ConfigMap
metadata:
  name: oryn-config
data:
  REDIS_URL: redis://redis:6379
  ORYN_PUBLIC_URL: https://oryn.example.com
  ORYN_COOKIE_SECURE: "true"
  ORYN_ALLOW_REGISTRATION: "false"
  ORYN_ALLOW_PRIVATE_NETWORK: "false"
  ORYN_LOG_FORMAT: json
  RUST_LOG: info
  ORYN_API_URL: http://api:8080
  ORYN_RUNNER_URL: http://playwright-runner:7400
