apiVersion: apps/v1
kind: Deployment
metadata: { name: worker }
spec:
  # Scale horizontally; each replica self-registers with the bootstrap token. For
  # stable identities across restarts use a StatefulSet with a volume for the token file,
  # or create one token per worker in the UI and set ORYN_WORKER_TOKEN instead.
  replicas: 2
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      terminationGracePeriodSeconds: 330
      containers:
        - name: worker
          image: ghcr.io/seyhunak/oryn-worker
          envFrom: [{ configMapRef: { name: oryn-config } }]
          env:
            - name: ORYN_WORKER_BOOTSTRAP_TOKEN
              valueFrom: { secretKeyRef: { name: oryn-secrets, key: ORYN_WORKER_BOOTSTRAP_TOKEN } }
            - name: ORYN_RUNNER_TOKEN
              valueFrom: { secretKeyRef: { name: oryn-secrets, key: ORYN_RUNNER_TOKEN } }
            - name: ORYN_WORKER_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: ORYN_WORKER_CONCURRENCY, value: "2" }
            - { name: ORYN_WORKER_TOKEN_FILE, value: /state/worker-token }
          volumeMounts: [{ name: state, mountPath: /state }]
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      volumes:
        - name: state
          emptyDir: {}
